# ============================================================
# Ibnu WM Portfolio — docker compose (production)
#
# Setup Nginx Proxy Manager:
#   1. Pastikan NPM dan service ini ada di Docker network yang SAMA.
#      Cek nama network NPM:  docker network ls
#      Lalu sesuaikan `name:` di bagian networks bawah.
#   2. docker compose up -d --build
#   3. Di NPM (http://npm:81):
#      Hosts -> Proxy Hosts -> Add Proxy Host
#        Domain Names : portfolio.ibnuwm.com
#        Forward Host : portfolio      (nama service/container)
#        Forward Port : 3000
#      Centang: Block Common Exploits, Websockets Support
#
# Opsional: kalau mau akses langsung tanpa NPM, hapus komentar `ports`.
# ============================================================

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* harus di-inline saat build (ARG di Dockerfile)
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        - NEXT_PUBLIC_GTM=${NEXT_PUBLIC_GTM:-}
        - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
        - NEXT_PUBLIC_EMAIL=${NEXT_PUBLIC_EMAIL:-}
        - NEXT_PUBLIC_PHONE=${NEXT_PUBLIC_PHONE:-}
        - NEXT_PUBLIC_WHATSAPP=${NEXT_PUBLIC_WHATSAPP:-}
        - NEXT_PUBLIC_RESUME_URL=${NEXT_PUBLIC_RESUME_URL:-}
        - NEXT_PUBLIC_ADDRESS=${NEXT_PUBLIC_ADDRESS:-}
        - NEXT_PUBLIC_OFFICE_ADDRESS=${NEXT_PUBLIC_OFFICE_ADDRESS:-}
        - NEXT_PUBLIC_OFFICE_HOURS=${NEXT_PUBLIC_OFFICE_HOURS:-}
    container_name: portfolio
    restart: unless-stopped
    # env untuk API server-only (Gmail + Telegram + reCAPTCHA secret). File .env opsional:
    # kalau tidak ada, API kontak balas error jelas.
    env_file:
      - path: .env
        required: false
    environment:
      - EMAIL_ADDRESS=${EMAIL_ADDRESS:-}
      - GMAIL_PASSKEY=${GMAIL_PASSKEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
    # langsung dari NPM via network bersama (tidak perlu publish port)
    expose:
      - "3000"
    # akses langsung (tanpa NPM): buka http://host:3100
    # ports:
    #   - "3100:3000"

networks:
  default:
    name: npm_default
    external: true
